name: Deploy API to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            if [ ! -d "app-health-monitor-devops" ]; then
              git clone https://github.com/${{ github.repository }}.git
            fi

            cd app-health-monitor-devops
            git pull

            docker stop health-api || true
            docker rm health-api || true

            docker build -t health-monitor-api ./app

            docker run -d -p 5000:5000 --restart unless-stopped --name health-api health-monitor-api
